name: HeavyMachRecovery
options:
  deploymentTarget:
    iOS: '15.0'
targets:
  HeavyMachRecovery:
    type: application
    platform: iOS
    sources: [Stub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gelb2.heavymach.recovery
        PRODUCT_NAME: HeavyMachRecovery
        DEVELOPMENT_TEAM: PDF8XXXYH9
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_DEBUG_DYLIB: NO
    postBuildScripts:
      - name: Package original Heavy Mach with compatibility runtime
        script: |
          if [ "$PLATFORM_NAME" = "iphonesimulator" ]; then
            TARGET=aarch64-apple-ios-sim
          else
            TARGET=aarch64-apple-ios
          fi
          "$SRCROOT/../build-heavy.sh" "$TARGET"
          python3 "$SRCROOT/../package-heavy.py" --xcode
        basedOnDependencyAnalysis: false
