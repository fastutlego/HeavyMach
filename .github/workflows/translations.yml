name: Visitor document translations
on:
  push:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CREDITS.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-SCOPE.md'
      - 'ASSET-LICENSES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/RESTORATION.md'
      - 'docs/public/features.md'
      - 'docs/public/implementation-status.md'
      - 'docs/public/build-and-install.md'
      - 'docs/public/gameplay-guide.md'
      - 'docs/public/architecture.md'
      - 'docs/public/development-history.md'
      - 'docs/public/troubleshooting.md'
      - 'docs/public/validation.md'
      - 'docs/public/lux-lunae-intent-20261028.md'
      - 'docs/public/index.md'
      - 'docs/public/design-intent.md'
      - 'docs/public/roadmap.md'
      - 'README.en.md'
      - 'CHANGELOG.en.md'
      - 'CREDITS.en.md'
      - 'CONTRIBUTING.en.md'
      - 'LICENSE-SCOPE.en.md'
      - 'ASSET-LICENSES.en.md'
      - 'THIRD_PARTY_NOTICES.en.md'
      - 'docs/en/RESTORATION.md'
      - 'docs/en/public/features.md'
      - 'docs/en/public/implementation-status.md'
      - 'docs/en/public/build-and-install.md'
      - 'docs/en/public/gameplay-guide.md'
      - 'docs/en/public/architecture.md'
      - 'docs/en/public/development-history.md'
      - 'docs/en/public/troubleshooting.md'
      - 'docs/en/public/validation.md'
      - 'docs/en/public/lux-lunae-intent-20261028.md'
      - 'docs/en/public/index.md'
      - 'docs/en/public/design-intent.md'
      - 'docs/en/public/roadmap.md'
      - 'docs/public/document-translation-scope.json'
      - 'docs/translations/**'
      - 'tools/check_translations.py'
      - 'tools/tests/test_translations.py'
      - '.github/workflows/translations.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CREDITS.md'
      - 'CONTRIBUTING.md'
      - 'LICENSE-SCOPE.md'
      - 'ASSET-LICENSES.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'docs/RESTORATION.md'
      - 'docs/public/features.md'
      - 'docs/public/implementation-status.md'
      - 'docs/public/build-and-install.md'
      - 'docs/public/gameplay-guide.md'
      - 'docs/public/architecture.md'
      - 'docs/public/development-history.md'
      - 'docs/public/troubleshooting.md'
      - 'docs/public/validation.md'
      - 'docs/public/lux-lunae-intent-20261028.md'
      - 'docs/public/index.md'
      - 'docs/public/design-intent.md'
      - 'docs/public/roadmap.md'
      - 'README.en.md'
      - 'CHANGELOG.en.md'
      - 'CREDITS.en.md'
      - 'CONTRIBUTING.en.md'
      - 'LICENSE-SCOPE.en.md'
      - 'ASSET-LICENSES.en.md'
      - 'THIRD_PARTY_NOTICES.en.md'
      - 'docs/en/RESTORATION.md'
      - 'docs/en/public/features.md'
      - 'docs/en/public/implementation-status.md'
      - 'docs/en/public/build-and-install.md'
      - 'docs/en/public/gameplay-guide.md'
      - 'docs/en/public/architecture.md'
      - 'docs/en/public/development-history.md'
      - 'docs/en/public/troubleshooting.md'
      - 'docs/en/public/validation.md'
      - 'docs/en/public/lux-lunae-intent-20261028.md'
      - 'docs/en/public/index.md'
      - 'docs/en/public/design-intent.md'
      - 'docs/en/public/roadmap.md'
      - 'docs/public/document-translation-scope.json'
      - 'docs/translations/**'
      - 'tools/check_translations.py'
      - 'tools/tests/test_translations.py'
      - '.github/workflows/translations.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tools/tests -p 'test_translations.py'
      - run: python3 tools/check_translations.py
